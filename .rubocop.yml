inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable

Layout/LineLength:
  Max: 120

# Spec files are named after the lib/adapters files, not the class names
RSpec/SpecFilePathFormat:
  CustomTransform:
    MediaInfoAdapter: mediainfo
    VideoLibrary: videolibrary
