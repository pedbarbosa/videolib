name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y mediainfo
      # Ruby version comes from .ruby-version; bundler-cache runs bundle install
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Set up test directory
        run: mkdir -p /tmp/video/TV
      - name: Run rake tests
        run: bundle exec rake
      - name: Set up videolib config
        run: cp videolib.yml ~/.videolib.yml
      - name: Run the script
        run: ./videolib.rb
