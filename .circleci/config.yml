version: 2.1

jobs:
  build:
    docker:
      # Keep in sync with .ruby-version
      - image: cimg/ruby:4.0.7
    steps:
      - checkout
      - run:
          name: Install packages
          command: sudo apt-get update && sudo apt-get install -y mediainfo
      - run:
          name: Install gems
          command: bundle install
      - run:
          name: Set up test library with season folders
          command: |
            mkdir -p "/tmp/video/TV/Helix/Season 1" "/tmp/video/TV/Helix/Season 2"
            cp spec/fixtures/sample.mkv "/tmp/video/TV/Helix/Season 1/Helix - S01E01 - Pilot HDTV-720p.mkv"
            cp spec/fixtures/sample.mkv "/tmp/video/TV/Helix/Season 2/Helix - S02E13 - O Brave New World HDTV-720p.mkv"
      - run:
          name: Run rake tests
          command: bundle exec rake
      - run:
          name: Set up videolib config
          command: cp videolib.yml ~/.videolib.yml
      - run:
          name: Run the script
          command: ./videolib.rb
      - run:
          name: Check the report
          command: grep -q 'Scanned 1 shows with 2 episodes' report/index.html
